# Parakeet Dictate settings.
# Edit and save. Changes are picked up at the start of the next dictation, or right away with
# "Reload settings" in the tray menu.

[hotkey]
# Tap once to start and again to stop, OR hold the keys while you talk and let go to stop.
keys = "ctrl+q"
# Holding longer than this many seconds counts as "hold to talk".
hold_threshold = 0.4
# Esc cancels a recording without typing anything.
esc_cancels = true
# More shortcuts, written like keys above (e.g. "ctrl+alt+c"); "" = none.
# Copy the last dictation to the clipboard:
copy_last = ""
# Open "Correct last dictation", to fix a word and teach it to the dictionary:
correct_last = ""

[model]
# Speech model (a .gguf file, the format Orca uses). "auto" finds every one already on this PC: Orca's
# downloads, other apps' model folders, or inside a WSL Linux distribution (copied to this PC once so it
# loads fast). New models you download in Orca (Parakeet v3, Whisper, ...) are found automatically;
# pick one in the tray menu under "Model". Parakeet TDT v2 (English) is preferred when there is a choice.
# If none is found, the tray menu offers to download Orca's Parakeet v2 (~730 MB, checksum verified).
# Or put a .gguf file or folder here, e.g. "%APPDATA%\\orca\\speech-models\\parakeet-tdt-0.6b-v2-int8".
# Models are only ever read, never changed.
dir = "auto"
# More places with speech models of your own: .gguf files or folders (searched two folder levels deep).
# Their models are listed under "Model" in the tray menu as "your folder", next to the ones found
# automatically (also when dir above is a fixed file or folder). Tray menu → "Add a model file…" adds a
# file here for you. A folder that is gone is simply skipped. For example:
# folders = ["D:\\models", "%USERPROFILE%\\Downloads\\whisper-small-Q8_0.gguf"]
folders = []
# Where the model runs. "auto" = graphics card if there is one (NVIDIA RTX 2050 here: 16 s of speech in
# 0.3 s), else the CPU (~4.5 s). "gpu" = discrete card, "igpu" = built-in Intel graphics, "cpu" = CPU.
# If the chosen device fails, the CPU is used instead.
# If the graphics card ever crashes the speech engine, that is remembered in
# %LOCALAPPDATA%\ParakeetDictate\gpu-failed.json and "auto" then uses only the CPU (the log says so).
# To try the graphics card again, delete that file, or set "gpu" or "igpu" here (they ignore it).
device = "auto"
# CPU threads used while transcribing on the CPU. 4 was the fastest on this laptop (i7-1260P).
threads = 4
# The model needs ~700 MB while loaded. It starts loading when you press the hotkey (while you are
# still talking) and its process is shut down this many seconds after a dictation ends, which gives
# all of that memory back to Windows. A new dictation within this time starts instantly.
# 0 = free it right after each dictation, -1 = keep it loaded.
unload_after_seconds = 30
# Transcribe what you've said so far at each pause while you keep talking, so only the last part is
# left when you stop (text appears almost immediately). false = transcribe everything after you stop.
process_while_speaking = true
# Type words while you are still talking, about a second behind your voice, instead of at each pause.
# Parakeet reads a whole phrase at a time, so the phrase being spoken is re-read about twice a second
# (on the graphics card each read takes a tenth of a second; on the CPU it is read less often). A word
# is typed once two reads agree on it; the last word or two show on the pill until they settle. At the
# pause the whole phrase is read once more and, if that differs, the end is corrected with Backspace
# (only in the window you started in). Needs the voice detector, [output] type_while_speaking and
# method = "type". false = type each phrase at the pause.
stream_while_speaking = true
# A pause at least this long (seconds) ends a phrase, which is then transcribed in the background.
# Shorter = text sooner but more risk of splitting a sentence. 0.6 is what Orca uses with its voice detector.
pause_seconds = 0.6
# Voice detector that decides where phrases start and end (Silero VAD, the ~1 MB file Orca downloads
# next to its speech models). Much better than a loudness level at telling speech from keyboard and fan
# noise, and it keeps 0.4 s before each phrase so first words aren't clipped.
# "auto" = find it on this PC; "off" = use the simple loudness detector; or the path of a .gguf file.
# If it can't be found or fails, the loudness detector is used.
vad = "auto"
# The language you dictate in: "auto", or a code such as "en", "de", "fr", "es", "ja", "zh".
# It is passed to models that can be told the language (multilingual Whisper, SenseVoice, ...); models that
# can't be told it detect the language themselves (the log says when it is ignored). It also picks the
# filler words removed below. An English-only model (Parakeet v2) always counts as English.
language = "auto"

[accuracy]
# Words and names the model should prefer. Only used by models that support it (transcribe.cpp's
# Parakeet does not, so for Parakeet the [cleanup.replacements] below do this job). Only add words the
# model actually gets WRONG.
hotwords = ["Keycloak", "Inkfree", "Mailzzy", "SoftSages", "CodeCommit"]
# Clean the recording before transcribing: remove DC offset, trim silence, raise quiet speech.
normalize_audio = true

[cleanup]
# Remove the thinking sounds of the dictation language (from Orca): English "um", "uh", "er", "hmm";
# German "äh", "ähm"; French "euh"; Spanish "ehh"; Japanese "えーと"; Chinese "呃"; and more. When the
# language isn't known, only sounds that are no word in any language go ("uh", "umm", "hmm").
# A filler on its own before ? or ! ("Hm?") is kept, and so is an all-caps "UM" or "ER" in normal text
# (more likely a name). false = only remove the words listed in fillers below.
language_fillers = true
# Your own fillers, removed on top of the language's when they appear as a whole word. Each letter may be
# stretched: "uh" also removes "uhh", "ah" also removes "AHH", "hm" also removes "hmm". "uh-huh" is never
# touched. These are English sounds; if you dictate in another language, take out any that are real words
# there (German "um", Spanish "eh").
fillers = ["uh", "um", "uhm", "ah", "er", "erm", "eh", "hm", "mm"]
# Collapse stutters such as "the the" or "I, I".
remove_repeated_words = true
# Words that can legitimately repeat ("he had had enough").
repeated_words_allowed = ["that", "had"]

# Exact fixes applied after transcription. Whole words only, not case sensitive.
# Usually [dictionary] below is the better place; use this only for fixes that aren't a name or term.
[cleanup.replacements]

[dictionary]
# Names and code terms spelled your way. Each one also fixes the spacing, hyphens and capitals the model
# hears it with: "Keycloak" fixes "key cloak", "Key-Cloak" and "KEYCLOAK"; "useAudioCapture" fixes
# "use audio capture". Only add words the model actually gets wrong.
terms = ["Keycloak", "Inkfree", "SoftSages", "CodeCommit", "Flyway", "DataGrip", "Postgres"]

# "Heard as": what the model writes when it mishears a term in a way the spelling alone can't fix.
# Spacing and capitals don't matter here either ("mail sey" also covers "Mail-Sey" and "mailsey").
[dictionary.heard_as]
"Mailzzy" = ["mail te", "mail sey", "mail say", "mail sea", "mailsy", "mail zee", "mailzy", "mail z", "mail c", "mail tc"]

# Terms for one program only, used when that program's window is in front as you start dictating.
# Name the program's .exe file (not case sensitive); its terms win over the ones above. For example:
#   [dictionary.apps."code.exe"]
#   terms = ["useAudioCapture", "pnpm", "tsconfig"]
#   [dictionary.apps."code.exe".heard_as]
#   "kubectl" = ["cube control", "cube cuddle"]
[dictionary.apps]

[output]
# "type" sends the text as keystrokes and leaves the clipboard alone.
# "paste" puts it on the clipboard, presses Ctrl+V, then restores what was on the clipboard.
# Either way, if the text can't be typed (no window has focus, or the window runs as administrator),
# it is put on the clipboard instead and a notification says so. Anything already typed stays.
method = "type"
# Type each phrase as soon as it is transcribed, while you keep talking (needs process_while_speaking).
# Nothing is typed while Ctrl/Alt/Shift/Win is held (hold-to-talk), so letters never turn into shortcuts;
# those phrases are typed the moment you let go. Esc stops the recording but keeps what was already typed.
# false = type everything at once after you stop.
type_while_speaking = true
# Add a space after each dictation so the next one doesn't stick to it.
add_trailing_space = true
# Press Enter once after the text is typed, e.g. to send a chat message or run a command straight away.
# Only when text was actually typed: not after a cancelled dictation, nothing heard, or text that went to
# the clipboard because it couldn't be typed.
press_enter = false
# Short beeps when recording starts / stops / is cancelled.
sounds = true
# Stop automatically after this many seconds.
max_seconds = 360
# Write the recognised text to the log file. Off by default: dictation can contain sensitive text.
log_transcripts = false

[overlay]
# Small "Listening / Transcribing / Typed" pill on top of all windows, on the screen you're working on.
# It never takes focus and clicks pass through it.
# Tray menu → "Move the pill…" lets you drag it anywhere, on any monitor; it then stays there (and on that
# monitor) and position / margin below are only used again after tray menu → "Reset pill position".
enabled = true
# "bottom" or "top" of the screen.
position = "bottom"
# How far from that edge of the screen, in pixels (at 100% display scaling). -1 = 24 at the top, 56 at
# the bottom. At the top, 60-80 puts it just below most window title bars and tab strips.
margin = -1

[audio]
# Part of the microphone's name, e.g. "Headset". Empty = the Windows default input.
# If no microphone matches (headset not plugged in), the Windows default is used and a notification says so.
input_device = ""
# Stop the dictation (and type what you said) when nothing has been said for this many seconds, so a
# forgotten tap doesn't keep the microphone open. Only in tap mode, never while you hold the keys.
# 0 = never stop for silence (max_seconds still applies).
silence_stop_seconds = 60

[commands]
# Say a command on its own, between two pauses, and it is carried out instead of typed. Capitals and
# punctuation don't matter, but the whole phrase must be just the command: "I added a new line to the
# file" is typed as you said it. false = never treat anything as a command.
enabled = true

# Phrase = what it does. Add, change or delete lines; what it does must be one of:
#   "newline"   = start a new line            "paragraph" = leave an empty line, start a new one
#   "undo"      = remove the phrase typed just before (with Backspace; only when typing, not pasting,
#                 and only if the same window is still in front, otherwise nothing is removed)
#   "stop"      = end the dictation, like pressing the hotkey
[commands.phrases]
"new line" = "newline"
"new paragraph" = "paragraph"
"scratch that" = "undo"
"delete that" = "undo"
"stop listening" = "stop"

[context]
# Spell code names and acronyms the way you write them, using words from where you are working: the
# window you are dictating into and your notes. Only words you actually say are changed, and only their
# spelling, spacing and capitals ("mcp auth filter" -> "McpAuthFilter", "tx ramp" -> "TX-RAMP").
# Ordinary words are never changed: single plain words like "Docker" are not picked up (put those in
# [dictionary]), nor anything spelled like a normal word ("IDEA" stays "idea").
enabled = true
# Take names from the title of the window you are dictating into (e.g. "McpAuthFilter.java - ss-core-service").
window_title = true
# Folders of notes (.md files, e.g. an Obsidian vault) to take names from. Read only, in the background,
# never while you dictate; the found words are kept in %LOCALAPPDATA%\ParakeetDictate\context_terms.json
# (the notes themselves are not copied). Hidden folders such as .obsidian and .trash are skipped.
# Add more folders the same way, e.g. ["D:\\Obsidian\\Knowledgebase", "D:\\work"] (only .md files are read).
folders = ["D:\\Obsidian\\Knowledgebase"]
# Keep at most this many names from the notes, the most used ones first (0..500).
max_terms = 300
# Look for changed notes at most this often (minutes). Only changed notes are read again.
refresh_minutes = 10
# Programs where you dictate code. Names made only of ordinary words, like "userId" or "displayName",
# are used only here, so "the user id field" in an email stays as you said it. Names with an unusual
# part ("ss-core-service", "McpAuthFilter") are used everywhere. Find a program's name: Task Manager -> Details.
code_apps = ["idea64.exe", "code.exe", "windowsterminal.exe", "orca.exe", "datagrip64.exe", "pycharm64.exe",
             "cursor.exe"]

# Settings for one program, by its .exe name (capitals don't matter). Each may change any of:
#   method, add_trailing_space, type_while_speaking, press_enter (see [output]) and commands (true/false).
# Settings you leave out follow [output] and [commands]. To find a program's name: Task Manager ->
# Details. Remove the # in front of the lines to use them, for example:
# [apps."windowsterminal.exe"]
# commands = false
# [apps."idea64.exe"]
# add_trailing_space = false
